<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a0a1f" />
  <meta name="description" content="Para ti 💜" />
  <title>Para ti 💜</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #2d1438 0%, #12081a 45%, #0a0510 100%);
      color: #f8eeff;
      overflow: hidden;
    }

    .scene {
      position: relative;
      width: min(100%, 420px);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
      text-align: center;
    }

    .sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(200, 150, 255, 0.6);
      animation: twinkle 3s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    /* —— Botón rojo —— */
    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      animation: fadeIn 0.8s ease;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .intro.hidden {
      opacity: 0;
      transform: scale(0.9);
      pointer-events: none;
      position: absolute;
    }

    .intro p {
      font-size: 1.05rem;
      color: rgba(248, 238, 255, 0.75);
      line-height: 1.5;
      max-width: 280px;
    }

    .btn-mal-dia {
      appearance: none;
      border: none;
      cursor: pointer;
      padding: 1.15rem 2rem;
      border-radius: 999px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(145deg, #ff2d55, #c41e3a);
      box-shadow:
        0 8px 32px rgba(255, 45, 85, 0.45),
        0 0 0 0 rgba(255, 45, 85, 0.5);
      animation: pulse-red 2s ease-in-out infinite;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      max-width: 320px;
      line-height: 1.35;
    }

    .btn-mal-dia:hover {
      transform: scale(1.04);
    }

    .btn-mal-dia:active {
      transform: scale(0.97);
    }

    @keyframes pulse-red {
      0%, 100% { box-shadow: 0 8px 32px rgba(255, 45, 85, 0.45), 0 0 0 0 rgba(255, 45, 85, 0.4); }
      50% { box-shadow: 0 12px 40px rgba(255, 45, 85, 0.55), 0 0 0 12px rgba(255, 45, 85, 0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* —— Ramo —— */
    .bouquet-wrap {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.75rem;
      animation: bloomIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .bouquet-wrap.visible {
      display: flex;
    }

    @keyframes bloomIn {
      0% { opacity: 0; transform: scale(0.6) translateY(40px); }
      60% { transform: scale(1.05) translateY(-8px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    .bouquet {
      width: min(300px, 85vw);
      height: auto;
      filter: drop-shadow(0 20px 40px rgba(120, 60, 180, 0.35));
    }

    .bouquet .stem {
      transform-origin: bottom center;
      animation: stemGrow 0.8s ease forwards;
      opacity: 0;
    }

    .bouquet .flower {
      transform-origin: bottom center;
      animation: flowerPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }

    .bouquet .leaf {
      animation: leafIn 0.6s ease forwards;
      opacity: 0;
    }

    .bouquet .stem:nth-child(1) { animation-delay: 0.1s; }
    .bouquet .stem:nth-child(2) { animation-delay: 0.15s; }
    .bouquet .stem:nth-child(3) { animation-delay: 0.2s; }
    .bouquet .stem:nth-child(4) { animation-delay: 0.25s; }
    .bouquet .stem:nth-child(5) { animation-delay: 0.3s; }
    .bouquet .stem:nth-child(6) { animation-delay: 0.35s; }
    .bouquet .stem:nth-child(7) { animation-delay: 0.4s; }

    .bouquet g.flower:nth-of-type(1) .flower { animation-delay: 0.35s; }
    .bouquet g.flower:nth-of-type(2) .flower { animation-delay: 0.45s; }
    .bouquet g.flower:nth-of-type(3) .flower { animation-delay: 0.5s; }
    .bouquet g.flower:nth-of-type(4) .flower { animation-delay: 0.55s; }
    .bouquet g.flower:nth-of-type(5) .flower { animation-delay: 0.6s; }
    .bouquet g.flower:nth-of-type(6) .flower { animation-delay: 0.65s; }
    .bouquet g.flower:nth-of-type(7) .flower { animation-delay: 0.7s; }

    @keyframes stemGrow {
      from { opacity: 0; transform: scaleY(0); }
      to { opacity: 1; transform: scaleY(1); }
    }

    @keyframes flowerPop {
      from { opacity: 0; transform: scale(0) rotate(-10deg); }
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes leafIn {
      from { opacity: 0; transform: scale(0); }
      to { opacity: 1; transform: scale(1); }
    }

    .message {
      font-size: 1.35rem;
      font-weight: 600;
      line-height: 1.5;
      color: #e8c8ff;
      text-shadow: 0 0 24px rgba(180, 100, 255, 0.4);
      animation: msgIn 1s ease 0.8s both;
      max-width: 300px;
    }

    .message .kiss {
      display: inline-block;
      animation: wiggle 1.5s ease-in-out 1.6s infinite;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-8deg); }
      75% { transform: rotate(8deg); }
    }

    .petal-float {
      position: fixed;
      width: 10px;
      height: 14px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: linear-gradient(135deg, #c084fc, #9333ea);
      opacity: 0;
      pointer-events: none;
      animation: fall 4s ease-in forwards;
    }

    @keyframes fall {
      0% { opacity: 0.8; transform: translateY(-20px) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100vh) rotate(360deg); }
    }

    .from {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: rgba(248, 238, 255, 0.45);
      animation: msgIn 1s ease 1.2s both;
    }
  </style>
</head>
<body>
  <div class="sparkles" id="sparkles" aria-hidden="true"></div>

  <main class="scene">
    <section class="intro" id="intro">
      <p>Algo pequeño para ti…</p>
      <button type="button" class="btn-mal-dia" id="btn-mal-dia">
        Presiona si tuviste mal día
      </button>
    </section>

    <section class="bouquet-wrap" id="bouquet-wrap" hidden>
      <svg class="bouquet" viewBox="0 0 280 320" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- Cinta del ramo -->
        <ellipse cx="140" cy="295" rx="55" ry="12" fill="#2a1535" opacity="0.6"/>
        <path d="M115 288 Q140 310 165 288" fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round"/>
        <path d="M125 292 Q140 302 155 292" fill="none" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>

        <!-- Tulipán 1 - centro alto -->
        <g class="flower">
          <path class="stem" d="M140 290 Q138 220 136 130" fill="none" stroke="#3d7a4a" stroke-width="3.5" stroke-linecap="round"/>
          <ellipse class="leaf" cx="128" cy="240" rx="14" ry="6" fill="#4ade80" transform="rotate(-35 128 240)" style="animation-delay:0.5s"/>
          <path class="flower" d="M136 130 C128 95 152 85 140 55 C128 85 152 95 136 130 Z" fill="#a855f7"/>
          <path class="flower" d="M140 55 C148 80 132 100 140 120 C148 100 132 80 140 55 Z" fill="#9333ea" opacity="0.7"/>
          <path class="flower" d="M140 75 C135 90 145 90 140 75 Z" fill="#ddd6fe" opacity="0.5"/>
        </g>

        <!-- Tulipán 2 - izquierda -->
        <g class="flower">
          <path class="stem" d="M140 290 Q105 230 95 155" fill="none" stroke="#3d7a4a" stroke-width="3" stroke-linecap="round"/>
          <ellipse class="leaf" cx="108" cy="250" rx="12" ry="5" fill="#4ade80" transform="rotate(-50 108 250)" style="animation-delay:0.55s"/>
          <path class="flower" d="M95 155 C88 125 108 118 98 95 C88 118 108 125 95 155 Z" fill="#c084fc"/>
          <path class="flower" d="M98 95 C105 115 92 130 98 145 C104 130 91 115 98 95 Z" fill="#9333ea" opacity="0.65"/>
        </g>

        <!-- Tulipán 3 - derecha -->
        <g class="flower">
          <path class="stem" d="M140 290 Q175 230 185 155" fill="none" stroke="#3d7a4a" stroke-width="3" stroke-linecap="round"/>
          <ellipse class="leaf" cx="172" cy="250" rx="12" ry="5" fill="#4ade80" transform="rotate(50 172 250)" style="animation-delay:0.6s"/>
          <path class="flower" d="M185 155 C192 125 172 118 182 95 C192 118 172 125 185 155 Z" fill="#c084fc"/>
          <path class="flower" d="M182 95 C175 115 188 130 182 145 C176 130 189 115 182 95 Z" fill="#9333ea" opacity="0.65"/>
        </g>

        <!-- Tulipán 4 - izquierda baja -->
        <g class="flower">
          <path class="stem" d="M140 290 Q115 260 108 190" fill="none" stroke="#3d7a4a" stroke-width="2.8" stroke-linecap="round"/>
          <path class="flower" d="M108 190 C102 165 118 160 112 142 C106 160 122 165 108 190 Z" fill="#b57edc"/>
          <path class="flower" d="M112 142 C118 158 107 170 112 180 C117 170 106 158 112 142 Z" fill="#7c3aed" opacity="0.6"/>
        </g>

        <!-- Tulipán 5 - derecha baja -->
        <g class="flower">
          <path class="stem" d="M140 290 Q165 260 172 190" fill="none" stroke="#3d7a4a" stroke-width="2.8" stroke-linecap="round"/>
          <path class="flower" d="M172 190 C178 165 162 160 168 142 C174 160 158 165 172 190 Z" fill="#b57edc"/>
          <path class="flower" d="M168 142 C162 158 173 170 168 180 C163 170 174 158 168 142 Z" fill="#7c3aed" opacity="0.6"/>
        </g>

        <!-- Tulipán 6 - atrás izq -->
        <g class="flower">
          <path class="stem" d="M140 290 Q120 210 125 170" fill="none" stroke="#357a42" stroke-width="2.5" stroke-linecap="round"/>
          <path class="flower" d="M125 170 C120 150 132 145 128 130 C124 145 136 150 125 170 Z" fill="#d8b4fe"/>
          <path class="flower" d="M128 130 C132 142 125 152 128 160 C131 152 124 142 128 130 Z" fill="#9333ea" opacity="0.5"/>
        </g>

        <!-- Tulipán 7 - atrás der -->
        <g class="flower">
          <path class="stem" d="M140 290 Q160 210 155 170" fill="none" stroke="#357a42" stroke-width="2.5" stroke-linecap="round"/>
          <path class="flower" d="M155 170 C160 150 148 145 152 130 C156 145 144 150 155 170 Z" fill="#d8b4fe"/>
          <path class="flower" d="M152 130 C148 142 155 152 152 160 C149 152 156 142 152 130 Z" fill="#9333ea" opacity="0.5"/>
        </g>
      </svg>

      <p class="message">
        Estos no se morirán <span class="kiss">muack</span> 💜
      </p>
      <p class="from">— con cariño, Diego</p>
    </section>
  </main>

  <script>
    const intro = document.getElementById("intro");
    const bouquetWrap = document.getElementById("bouquet-wrap");
    const btn = document.getElementById("btn-mal-dia");
    const sparklesEl = document.getElementById("sparkles");

    for (let i = 0; i < 24; i++) {
      const s = document.createElement("span");
      s.className = "sparkle";
      s.style.left = Math.random() * 100 + "%";
      s.style.top = Math.random() * 100 + "%";
      s.style.animationDelay = Math.random() * 3 + "s";
      sparklesEl.appendChild(s);
    }

    function spawnPetals() {
      for (let i = 0; i < 12; i++) {
        setTimeout(() => {
          const p = document.createElement("span");
          p.className = "petal-float";
          p.style.left = 20 + Math.random() * 60 + "%";
          p.style.top = "-20px";
          p.style.animationDelay = Math.random() * 0.5 + "s";
          p.style.animationDuration = 3 + Math.random() * 3 + "s";
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 6000);
        }, i * 200);
      }
    }

    btn.addEventListener("click", () => {
      intro.classList.add("hidden");
      bouquetWrap.hidden = false;
      bouquetWrap.classList.add("visible");
      spawnPetals();
    });
  </script>
</body>
</html>
